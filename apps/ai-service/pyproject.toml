[tool.poetry]
name = "artify-ai-service"
version = "1.0.0"
description = "AI service for ArtifyPro - image generation and embeddings"
authors = ["ArtifyPro Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
httpx = "^0.25.0"
python-multipart = "^0.0.6"
pillow = "^10.1.0"
openai = "^1.5.0"
pinecone-client = "^3.0.0"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"
mypy = "^1.7.0"
pytest = "^7.4.0"
black = "^23.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_WEB: artify-web
  ECR_REPOSITORY_API: artify-api
  ECR_REPOSITORY_AI: artify-ai-service
  ECR_REPOSITORY_COLLAB: artify-collab

jobs:
  # TypeScript & Code Quality Checks
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

      - name: Python linting (ruff)
        run: |
          cd apps/ai-service
          pip install ruff
          ruff check .

      - name: Python typecheck (mypy)
        run: |
          cd apps/ai-service
          pip install mypy
          mypy .

  # Unit Tests
  test:
    runs-on: ubuntu-latest
    needs: quality-check
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: artify_test
          POSTGRES_USER: artify
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Run database migrations (test)
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://artify:test_password@localhost:5432/artify_test

      - name: Run Vitest tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://artify:test_password@localhost:5432/artify_test
          REDIS_URL: redis://localhost:6379

      - name: Run Python tests
        run: |
          cd apps/ai-service
          pip install -e .
          pytest

  # Build Docker Images
  build:
    runs-on: ubuntu-latest
    needs: [quality-check, test]
    outputs:
      web-image: ${{ steps.build-web.outputs.digest }}
      api-image: ${{ steps.build-api.outputs.digest }}
      ai-image: ${{ steps.build-ai.outputs.digest }}
      collab-image: ${{ steps.build-collab.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Web App
      - name: Build and push web image
        id: build-web
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG ./apps/web
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_WEB:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_WEB:latest
          echo "digest=$(docker inspect $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG | jq -r '.[0].RepoDigests[0]')" >> $GITHUB_OUTPUT

      # Build API
      - name: Build and push API image
        id: build-api
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG ./apps/api
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_API:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:latest
          echo "digest=$(docker inspect $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG | jq -r '.[0].RepoDigests[0]')" >> $GITHUB_OUTPUT

      # Build AI Service
      - name: Build and push AI service image
        id: build-ai
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG ./apps/ai-service
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_AI:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_AI:latest
          echo "digest=$(docker inspect $ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG | jq -r '.[0].RepoDigests[0]')" >> $GITHUB_OUTPUT

      # Build Collaboration Service
      - name: Build and push collab image
        id: build-collab
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_COLLAB:$IMAGE_TAG ./apps/collab
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_COLLAB:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_COLLAB:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_COLLAB:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_COLLAB:latest
          echo "digest=$(docker inspect $ECR_REGISTRY/$ECR_REPOSITORY_COLLAB:$IMAGE_TAG | jq -r '.[0].RepoDigests[0]')" >> $GITHUB_OUTPUT

  # Deploy to ECS Fargate
  deploy-api:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service (API)
        run: |
          aws ecs update-service \
            --cluster artify-cluster \
            --service artify-api-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS service (AI Service)
        run: |
          aws ecs update-service \
            --cluster artify-cluster \
            --service artify-ai-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS service (Collaboration)
        run: |
          aws ecs update-service \
            --cluster artify-cluster \
            --service artify-collab-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

  # Deploy Web App to Vercel
  deploy-web:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web

  # Deploy Collaboration Server to DigitalOcean
  deploy-collab:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /opt/artify/collab
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_COLLAB }}:latest
            docker stop artify-collab || true
            docker rm artify-collab || true
            docker run -d \
              --name artify-collab \
              -p 1234:1234 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_COLLAB }}:latest
            docker system prune -f